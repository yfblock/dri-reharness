<svg xmlns="http://www.w3.org/2000/svg" width="640" height="960" viewBox="0 0 640 960" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="640" height="960" fill="#f8fafc"/>

  <text x="320" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">LangGraph Workflow 拓扑</text>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#64748b">src/langgraph_workflow/graph.py — build_graph()</text>

  <!-- ======== edges ======== -->
  <g stroke="#475569" stroke-width="1.8" fill="none">
    <line x1="320" y1="113" x2="320" y2="160" marker-end="url(#arrow)"/>
    <line x1="320" y1="217" x2="320" y2="263" marker-end="url(#arrow)"/>
    <line x1="320" y1="317" x2="320" y2="363" marker-end="url(#arrow)"/>
    <line x1="320" y1="417" x2="320" y2="460" marker-end="url(#arrow)"/>
    <!-- conditional: true -> run_project_pipeline -->
    <path d="M 320 517 C 320 558, 175 558, 175 597" marker-end="url(#arrow)"/>
    <!-- conditional: false -> finalize -->
    <path d="M 450 490 C 520 560, 448 700, 368 735" marker-end="url(#arrow)"/>
    <!-- run_project_pipeline -> finalize -->
    <path d="M 175 651 C 175 702, 182 744, 189 744" marker-end="url(#arrow)"/>
    <line x1="320" y1="772" x2="320" y2="829" marker-end="url(#arrow)"/>
  </g>

  <!-- edge labels -->
  <text x="253" y="551" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">run_pipeline = true</text>
  <text x="497" y="618" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">run_pipeline = false</text>

  <!-- ======== START ======== -->
  <rect x="260" y="77" width="120" height="36" rx="18" fill="#0f172a"/>
  <text x="320" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#f8fafc">START</text>

  <!-- ======== normalize_input ======== -->
  <rect x="190" y="163" width="260" height="54" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="320" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">normalize_input</text>
  <text x="320" y="205" text-anchor="middle" font-size="11" fill="#6366f1">→ normalized</text>

  <!-- ======== discover_driver_files ======== -->
  <rect x="190" y="263" width="260" height="54" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="320" y="286" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">discover_driver_files</text>
  <text x="320" y="305" text-anchor="middle" font-size="11" fill="#6366f1">→ inventory</text>

  <!-- ======== analyze_driver_files ======== -->
  <rect x="190" y="363" width="260" height="54" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="320" y="386" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">analyze_driver_files</text>
  <text x="320" y="405" text-anchor="middle" font-size="11" fill="#6366f1">→ analysis（readiness / 契约验证）</text>

  <!-- ======== build_pipeline_plan ======== -->
  <rect x="190" y="463" width="260" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="320" y="486" text-anchor="middle" font-size="14" font-weight="600" fill="#78350f">build_pipeline_plan</text>
  <text x="320" y="505" text-anchor="middle" font-size="11" fill="#b45309">→ pipeline_plan（readiness 门控 + 条件路由）</text>

  <!-- ======== run_project_pipeline ======== -->
  <rect x="45" y="597" width="260" height="54" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="175" y="620" text-anchor="middle" font-size="14" font-weight="600" fill="#164e63">run_project_pipeline</text>
  <text x="175" y="639" text-anchor="middle" font-size="11" fill="#0891b2">→ pipeline_result</text>

  <!-- ======== finalize ======== -->
  <rect x="190" y="718" width="260" height="54" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="741" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">finalize</text>
  <text x="320" y="760" text-anchor="middle" font-size="11" fill="#16a34a">→ status / translation_status / failure</text>

  <!-- ======== END ======== -->
  <rect x="270" y="832" width="100" height="36" rx="18" fill="#0f172a"/>
  <text x="320" y="855" text-anchor="middle" font-size="14" font-weight="600" fill="#f8fafc">END</text>

  <!-- footnote -->
  <text x="320" y="915" text-anchor="middle" font-size="11" fill="#64748b">唯一的条件分支在 build_pipeline_plan 之后（route_pipeline）：</text>
  <text x="320" y="932" text-anchor="middle" font-size="11" fill="#64748b">run_pipeline = translation_requested 且 translation_eligible（readiness.llm_synthesis_ready）</text>
</svg>
